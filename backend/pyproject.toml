[project]
name = "fantasy-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.13",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.22",
    "slowapi>=0.1.9",
    "uvicorn>=0.34.3",
    "pypdfium2>=5.6.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "numpy>=1.24.0",
    "joblib>=1.5.0",
    "polars>=2.1",
]

[dependency-groups]
test = ["pytest>=8.4.1", "pytest-asyncio>=0.24.0", "pytest-cov>=6.2.1"]
# Training, model compilation and offline calibration only. The web process
# serves the compiled NumPy models (model_stats_inference/serving/compiled_model.py)
# and never imports scikit-learn or SciPy, so the Docker image leaves this out.
training = ["scikit-learn>=1.9.0"]
# The pandas research/training pipeline, the offline scripts and the tests'
# pandas oracles (parity tests against the pandas originals). The web process
# runs on Polars + NumPy and never imports pandas or pyarrow (~36 MB RSS and
# ~170 ms CPU at import, measured), so the Docker image leaves this out too.
offline = ["pandas>=2.3.0", "pyarrow>=24.0.0"]
ml-research = ["shap>=0.52.0", "matplotlib>=3.11.0", "lightgbm>=4.6.0"]

[tool.uv]
default-groups = ["test", "training", "offline"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "real_dataprovider: use real DataProvider singleton (nested patch) for unit tests",
    "live: hits a real external API (ESPN); excluded by default, run with -m live",
]

