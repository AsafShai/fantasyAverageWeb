.pc{gap:8px}.pname{border:none;background:none;padding:0;font-size:15px;font-weight:700;color:#1D4ED8;cursor:pointer;text-align:left;flex:1;min-width:0}.pdot{font-style:normal;font-size:11px;margin-right:6px}.pdot.dg{color:#16A34A}.pdot.dy{color:#F59E0B}.pdot.dr{color:#DC2626}
.tlogo{width:40px;height:40px;object-fit:contain}.big3{font-size:18px;font-weight:700}
.bdg.fa{background:#FEF3C7;color:#92400E;border-color:#FDE68A;font-size:10px;padding:1px 5px;margin-right:4px}
.dlt.ipill{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}.dlt.ipill.po{background:#FEE2E2;color:#B91C1C}.dlt.ipill.pd{background:#FFEDD5;color:#C2410C}.dlt.ipill.pq{background:#FEF9C3;color:#854D0E}.dlt.ipill.pp{background:#DBEAFE;color:#1D4ED8}
.td.mutec{color:#C8CED8}
.tiles{display:grid;gap:6px}.tiles.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:#F2F4F7;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pg > .tiles .tile{background:#FFFFFF}
.tile.warn{background:#FDE2D2}
.tl{font-size:10px;font-weight:700;color:#5B6474;letter-spacing:.04em;text-transform:uppercase}
.tv{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}.tv.sm{font-size:14px}
.dead{background:linear-gradient(120deg,#1D4ED8,#7C3AED);color:#FFFFFF;border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px}
.dl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85}.dv{grid-row:span 2;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}.ds{font-size:12px;opacity:.85}
.mv{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid #EEF0F3;font-size:13px}
.add{color:#15803D}.drop{color:#5B6474}
.lrow{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border:none;border-radius:10px;background:#F2F4F7;text-align:left;cursor:pointer;margin-bottom:6px}
.lrow.big{background:#FFFFFF;min-height:60px;padding:8px 14px}
.lrow.me{box-shadow:inset 3px 0 0 #1D4ED8;background:#EEF3FE}
.lrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.rk{width:26px;height:26px;border-radius:999px;background:#DCE6FC;color:#1D4ED8;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.chev{color:#9AA3B2;font-size:20px}
.list{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.rkbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.cat{border-radius:8px;padding:5px 0;text-align:center;display:flex;flex-direction:column}
.cat span{font-size:9px;font-weight:700}.cat b{font-family:'Space Grotesk',sans-serif;font-size:14px}
.cov{display:flex;gap:6px;overflow-x:auto}
.cd{flex-shrink:0;width:92px;background:#F2F4F7;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:1px}
.cd b{font-family:'Space Grotesk',sans-serif;font-size:20px}
.pcard{border:1px solid #E3E6EB;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.x{border:none;background:#F2F4F7;border-radius:8px;width:28px;height:28px;cursor:pointer}
.mini{font-size:12px;color:#3B4556}
.card.sum{border:1.5px solid #A9C0F5}
.lab{flex:1;display:flex;flex-direction:column;gap:4px}
.prof{flex-direction:row;align-items:center}
.ph{width:72px;height:72px;border-radius:999px;background:#F2F4F7;object-fit:cover}
.pi{display:flex;flex-direction:column;gap:4px;min-width:0}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:#E8EEFD;color:#1D4ED8}
details.card summary{cursor:pointer}
.fv{display:flex;align-items:baseline;gap:8px}.fv b{font-family:'Space Grotesk',sans-serif;font-size:30px}
.rng{width:100%}
.race{display:flex;flex-direction:column;gap:6px}
.rb{display:flex;align-items:center;gap:8px;font-size:13px}.rb .nm{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spark{flex:1;font-family:monospace;color:#1D4ED8;letter-spacing:-1px}
.dp{display:flex;gap:10px;padding:8px 0;border-top:1px solid #EEF0F3}.pos{width:28px;font-size:12px}.dpl{display:flex;flex-wrap:wrap;gap:6px}
.dpp{font-size:13px;padding:4px 8px;border-radius:8px;background:#F2F4F7}.dpp i{font-style:normal;color:#C2410C;margin-left:4px;font-size:11px}.dpp.inj{background:#FDE2D2}
.game{background:#FFFFFF;border-radius:14px;padding:10px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.gt{display:flex;justify-content:space-between;font-size:15px}
.bars{display:flex;gap:4px;align-items:flex-end;height:150px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.bf{width:100%;background:#5B84E8;border-radius:4px 4px 0 0}.bf.hv{background:#1E3A8A}
.bv{font-size:11px;font-weight:700}.bl{font-size:9px;color:#5B6474}
.emo{font-size:26px}.emo.xl{font-size:56px}
.game-area{align-items:center;padding:28px 14px}
</style>

<style>html,body{margin:0;background:#E5E7EB}#root{width:390px;margin:16px auto;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hint{font:13px Inter,system-ui,sans-serif;color:#3B4556;text-align:center;margin:12px}</style></head>
<body><p class="hint">Mobile redesign v2 · open with <code>?start=team</code>, <code>?start=players</code> … to jump to a page. Everything else is clickable.</p>
<div id="root"></div><template id="t">

<div class="{{ rootCls }}" style="filter: {{ rootFilter }}; width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F7; font-family: Inter, system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div class="addr"><button type="button" class="bk {{ backCls }}" onClick="{{ browserBack }}" aria-label="Browser back">‹</button><span class="url">🔒 {{ url }}</span></div>
  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 14px; background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <button type="button" onClick="{{ go.home }}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; border: none; background: none; padding: 0; cursor: pointer; text-align: left"><span style="width: 14px; height: 14px; border-radius: 999px; background: linear-gradient(135deg, #2563EB, #7C3AED)"></span><span class="brand">Fantasy League</span></button>
    <button type="button" onClick="{{ openSearch }}" aria-label="Search" style="width: 42px; height: 42px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0E1726" stroke-width="1.7" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M14 14l4 4"></path></svg></button>
    <button type="button" onClick="{{ toggleDark }}" aria-label="Dark mode" style="width: 42px; height: 42px; border: none; background: none; cursor: pointer; font-size: 17px">🌙</button>
    <button type="button" onClick="{{ openMenu }}" aria-label="Menu" style="width: 42px; height: 42px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>


  <div class="noscroll" style="flex: 1; overflow-y: auto; padding: 12px 12px 20px">

    <!-- ===== today ===== -->
    <sc-if value="{{ on_today }}" hint-placeholder-val="{{ false }}">
      <div class="pg">
<sc-if value="{{ showDeadline }}" hint-placeholder-val="{{ false }}"><button type="button" class="dead" onClick="{{ go.trade }}"><span class="dl">Trade Deadline</span><span class="dv">{{ D.sum.deadline }}</span><span class="ds">Mar 15, 2027 · Trade Analyzer ›</span></button></sc-if><div class="pt"><div class="ptl"><h1 class="h1">Today</h1><span class=meta>🕒 ESPN updated today, {{ D.sum.espn }}</span></div><button type="button" class="link r" onClick="{{ go.box }}">{{ D.today.slate }} · {{ D.today.games }} games ›</button></div><section class="race"><div class="ch"><h2 class="h2 w">Top 5 Teams (average)</h2><span class="meta w2">pts · since yesterday</span></div><sc-for list="{{ race }}" as="r" hint-placeholder-count="5"><button type="button" class="rr" onClick="{{ r.open }}"><span class="rn">{{ r.rank }}</span><span class="rt" style="font-weight: {{ r.weight }}">{{ r.name }}</span><span class="rp">{{ r.pts }}</span><span class="rd" style="color: {{ r.dc }}">{{ r.d }}</span></button></sc-for><button type="button" class="btn dark" onClick="{{ go.standings }}">Full standings</button></section><section class="card "><div class="ch"><h2 class="h2">Rank movers</h2><button type="button" class="link" onClick="{{ go.rankMoves }}">Rankings ›</button></div><div class="frow"><span class="meta">vs yesterday</span><button type="button" class="sel" onClick="{{ P.moverTeam.open }}">{{ P.moverTeam.label }}<span class="caret">▾</span></button><button type="button" class="sel" onClick="{{ P.moverCat.open }}">{{ P.moverCat.label }}<span class="caret">▾</span></button></div><div class="scrollbox noscroll"><sc-for list="{{ movers }}" as="m" hint-placeholder-count="6"><button type="button" class="mvr {{ m.cls }}" onClick="{{ m.open }}"><span class="md" style="color: {{ m.color }}">{{ m.d }}</span><span class="mt"><b>{{ m.name }}</b><span class="meta">{{ m.why }}</span></span><span class="chev">›</span></button></sc-for></div><button type="button" class="btn" onClick="{{ go.rankMoves }}">All changes in Rankings</button></section><section class="card "><div class="ch"><h2 class="h2">Roster health today</h2><button type="button" class="link" onClick="{{ go.injuries }}">Injuries ›</button></div><div class="tiles c2"><sc-for list="{{ healthTiles2 }}" as="t" hint-placeholder-count="4"><div class="tile edge {{ t.cls }}"><span class="tv">{{ t.v }}</span><span class="meta">{{ t.k }}</span></div></sc-for></div><div class="tw noscroll"><div class="t" role="table">
  <div class="tr hd" role="row"><sc-for list="{{ tHealth2.head }}" as="h" hint-placeholder-count="6"><div class="th {{ h.cls }}" role="columnheader"><button type="button" class="thb" onClick="{{ h.pick }}">{{ h.v }}</button></div></sc-for></div>
  <sc-for list="{{ tHealth2.rows }}" as="r" hint-placeholder-count="8"><div class="tr {{ r.cls }}" role="row" onClick="{{ r.open }}"><sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="6"><div class="td {{ c.cls }}" role="cell"><sc-if value="{{ c.b }}" hint-placeholder-val="{{ false }}"><span class="bdg {{ c.bc }}">{{ c.b }}</span></sc-if>{{ c.v }}<span class="dlt {{ c.dc }}">{{ c.d }}</span></div></sc-for></div></sc-for>
</div></div><span class="meta">Slate 2026-11-06</span><button type="button" class="btn" onClick="{{ go.injuries }}">Injury report</button></section><section class="card "><div class="ch"><h2 class="h2">Latest moves</h2><button type="button" class="link" onClick="{{ go.activity }}">All activity →</button></div><sc-for list="{{ latest2 }}" as="m" hint-placeholder-count="6"><div class="lm"><span class="lmd">{{ m.date }}</span><div class="lmb"><span><b>{{ m.team }}</b> <span class="kb {{ m.kc }}">{{ m.kind }}</span> <span class="add">+ {{ m.add }}</span></span><span class="drop">− {{ m.drop }}</span></div></div></sc-for></section><section class="card "><div class="ch"><h2 class="h2">League averages</h2><button type="button" class="link" onClick="{{ go.standingsVals }}">Standings ›</button></div><span class="meta">per team, season to date</span><div class="tiles c3"><sc-for list="{{ avgTiles }}" as="t" hint-placeholder-count="6"><div class="tile {{ t.cls }}"><span class="tl">{{ t.k }}</span><span class="tv">{{ t.v }}</span></div></sc-for></div><button type="button" class="btn" onClick="{{ go.standingsVals }}">Compare teams in Standings</button></section>
      </div>
    </sc-if>

    <!-- ===== rankings ===== -->
    <sc-if value="{{ on_rankings }}" hint-placeholder-val="{{ false }}">
      <div class="pg">

        <div class="pt"><div class="ptl"><h1 class="h1">{{ rkTitle }}</h1><span class=meta>🕒 ESPN updated today, {{ D.sum.espn }}</span></div><button type="button" class="ibtn" aria-label="Share"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 11v5h12v-5"></path></svg></button></div>
        <p class="meta">{{ rkExplain }}</p>
        <div class="three"><div class="lab"><span class="meta">Layout</span><div class="seg sm"><sc-for list="{{ rkLayout }}" as="o" hint-placeholder-count="2"><button type="button" class="sb {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div></div><div class="lab"><span class="meta">Show</span><div class="seg sm"><sc-for list="{{ rkView }}" as="o" hint-placeholder-count="2"><button type="button" class="sb {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div></div><div class="lab"><span class="meta">Values</span><div class="seg sm"><sc-for list="{{ rkMode }}" as="o" hint-placeholder-count="2"><button type="button" class="sb {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div></div></div>
        <div class="frow"><button type="button" class="sel grow" onClick="{{ toggleRange }}">Date range: {{ rangeLabel }}<span class="caret">▾</span></button><sc-if value="{{ rkShowMovers }}" hint-placeholder-val="{{ true }}"><button type="button" class="chip {{ moversCls }}" onClick="{{ toggleMovers }}">▲▼ {{ moversLabel }}</button></sc-if></div>
        <sc-if value="{{ rangeOpen }}" hint-placeholder-val="{{ false }}"><div class="card inl"><div class="frow"><span class="inp">From<b>Oct 20</b></span><span class="inp">To<b>Nov 6</b></span></div><div class="frow"><button type="button" class="btn sm pri grow">Apply</button><button type="button" class="btn sm grow">Clear</button></div><span class="meta">Quick range</span><div class="chips noscroll"><sc-for list="{{ quickRange }}" as="o" hint-placeholder-count="5"><button type="button" class="chip {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div></div></sc-if>
        <div class="tiles c2"><sc-for list="{{ rkTiles }}" as="t" hint-placeholder-count="6"><div class="tile {{ t.cls }}"><span class="tl">{{ t.k }}</span><span class="tv">{{ t.v }}</span></div></sc-for></div>
        <sc-if value="{{ rkIsTable }}" hint-placeholder-val="{{ true }}"><div class="tw noscroll"><div class="t" role="table">
  <div class="tr hd" role="row"><sc-for list="{{ tRank.head }}" as="h" hint-placeholder-count="6"><div class="th {{ h.cls }}" role="columnheader"><button type="button" class="thb" onClick="{{ h.pick }}">{{ h.v }}</button></div></sc-for></div>
  <sc-for list="{{ tRank.rows }}" as="r" hint-placeholder-count="8"><div class="tr {{ r.cls }}" role="row" onClick="{{ r.open }}"><sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="6"><div class="td {{ c.cls }}" role="cell"><sc-if value="{{ c.b }}" hint-placeholder-val="{{ false }}"><span class="bdg {{ c.bc }}">{{ c.b }}</span></sc-if>{{ c.v }}<span class="dlt {{ c.dc }}">{{ c.d }}</span></div></sc-for></div></sc-for>
</div></div></sc-if>
        <sc-if value="{{ rkIsCards }}" hint-placeholder-val="{{ false }}"><div class="pg"><sc-for list="{{ rkCards }}" as="t" hint-placeholder-count="12"><button type="button" class="card tcard {{ t.cls }}" onClick="{{ t.open }}"><div class="ch"><span class="h2">{{ t.rank }} · {{ t.name }}</span><span class="tot"><span class="tl">Total</span><b>{{ t.total }}</b><span class="dlt {{ t.dc }}">{{ t.d }}</span></span><span class="tot"><span class="tl">GP</span><b>{{ t.gp }}</b><span class="dlt gp">{{ t.gpd }}</span></span></div><div class="cgrid"><sc-for list="{{ t.cats }}" as="c" hint-placeholder-count="8"><div class="cg"><span class="tl">{{ c.k }}</span><span><b>{{ c.v }}</b><span class="dlt {{ c.dc }}">{{ c.d }}</span></span></div></sc-for></div></button></sc-for></div></sc-if>
        <p class="meta">{{ rkLegend }}</p>

      </div>
    </sc-if>

    <!-- ===== teams ===== -->
    <sc-if value="{{ on_teams }}" hint-placeholder-val="{{ false }}">
      <div class="pg">

        <div class="pt"><div class="ptl"><h1 class="h1">Teams</h1><span class=meta>Browse all teams in your fantasy league</span></div></div>
        <div class="list"><sc-for list="{{ teamCards }}" as="t" hint-placeholder-count="12"><button type="button" class="lrow big {{ t.cls }}" onClick="{{ t.open }}"><span class="nm"><b>{{ t.name }}</b><span class="meta">Team #{{ t.id }}{{ t.mine }}</span></span><span class="chev">›</span></button></sc-for></div>

      </div>
    </sc-if>

    <!-- ===== team ===== -->
    <sc-if value="{{ on_team }}" hint-placeholder-val="{{ false }}">
      <div class="pg">

        <button type="button" class="back" onClick="{{ go.teams }}">‹ Back to Teams</button>
        <section class="card"><div class="ch"><span class="big">#{{ tdHead.rank }} · {{ tdHead.pts }} pts</span><span class="dd" style="color: {{ tdHead.dc }}">{{ tdHead.d }}</span></div>
          <div class="cats"><sc-for list="{{ tdRanks }}" as="c" hint-placeholder-count="8"><div class="cat" style="background: {{ c.bg }}; color: {{ c.fg }}"><span>{{ c.k }}</span><b>{{ c.v }}</b></div></sc-for></div>
          <span class="meta">Ranking Summary (Averages) · ESPN updated today, {{ D.sum.espn }}</span>
          <div class="frow"><a class="btn sm espn grow" href="#">View on ESPN ↗</a><button type="button" class="ibtn" aria-label="Share"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 11v5h12v-5"></path></svg></button></div></section>
        <div class="seg"><sc-for list="{{ tdTabs }}" as="o" hint-placeholder-count="2"><button type="button" class="sb {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div>
        <sc-if value="{{ tdIsStats }}" hint-placeholder-val="{{ true }}"><div class="pg">
          <section class="card "><div class="ch"><h2 class="h2">Team statistics</h2></div><div class="kv"><span>Overall rank</span><b>#{{ tdHead.rank }}</b></div><div class="kv"><span>Total points</span><b>{{ tdHead.pts }}</b></div><div class="kv"><span>Field goals</span><b>{{ tdFg }}</b></div><div class="kv"><span>Free throws</span><b>{{ tdFt }}</b></div><div class="kv"><span>Total Games Played</span><b>{{ tdGp }}</b></div></section>
          <section class="card "><div class="ch"><h2 class="h2">Shot Chart Stats</h2></div><div class="tiles c3"><sc-for list="{{ tdShot }}" as="t" hint-placeholder-count="6"><div class="tile {{ t.cls }}"><span class="tl">{{ t.k }}</span><span class="tv">{{ t.v }}</span></div></sc-for></div></section>
          <section class="card "><div class="ch"><h2 class="h2">Per-Game Averages</h2></div><div class="tiles c4"><sc-for list="{{ tdAvg }}" as="t" hint-placeholder-count="6"><div class="tile {{ t.cls }}"><span class="tl">{{ t.k }}</span><span class="tv">{{ t.v }}</span></div></sc-for></div></section>
        </div></sc-if>
        <sc-if value="{{ tdIsRoster }}" hint-placeholder-val="{{ false }}"><div class="pg">
          <div class="seg"><sc-for list="{{ tdMode }}" as="o" hint-placeholder-count="2"><button type="button" class="sb {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div>
          <sc-if value="{{ tdShowDaily }}" hint-placeholder-val="{{ true }}"><div class="pg">
            <div class="frow"><button type="button" class="btn sm" aria-label="Previous day" onClick="{{ dayPrev }}">‹</button><button type="button" class="sel grow" aria-label="Pick a day">{{ dayLabel }}<span class="caret">▾</span></button><button type="button" class="btn sm" aria-label="Next day" onClick="{{ dayNext }}">›</button></div>
            <section class="card"><div class="ch"><h2 class="h2">Moves</h2><span class="meta">{{ dayMovesCount }}</span></div><sc-for list="{{ dayMoves }}" as="mv" hint-placeholder-count="2"><div class="mv"><span class="meta">{{ mv.time }} · {{ mv.kind }}</span><span><b class="add">Added {{ mv.add }}</b>  <span class="drop">Dropped {{ mv.drop }}</span></span></div></sc-for><sc-if value="{{ dayNoMoves }}" hint-placeholder-val="{{ false }}"><p class="meta">No adds or drops this day</p></sc-if></section>
            <section class="card"><div class="ch"><h2 class="h2">Roster</h2><span class="meta">{{ dayStarters }}</span></div><div class="tw noscroll"><div class="t" role="table">
  <div class="tr hd" role="row"><sc-for list="{{ tDayLineup.head }}" as="h" hint-placeholder-count="6"><div class="th {{ h.cls }}" role="columnheader"><button type="button" class="thb" onClick="{{ h.pick }}">{{ h.v }}</button></div></sc-for></div>
  <sc-for list="{{ tDayLineup.rows }}" as="r" hint-placeholder-count="8"><div class="tr {{ r.cls }}" role="row" onClick="{{ r.open }}"><sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="6"><div class="td {{ c.cls }}" role="cell"><sc-if value="{{ c.b }}" hint-placeholder-val="{{ false }}"><span class="bdg {{ c.bc }}">{{ c.b }}</span></sc-if>{{ c.v }}<span class="dlt {{ c.dc }}">{{ c.d }}</span></div></sc-for></div></sc-for>
</div></div></section>
            <p class="meta">{{ dayNote }}</p>
