<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot usage — simplified</title>
<style>
  :root{
    --card:#fff; --page:#f9fafb; --ink:#111827; --ink2:#4b5563; --ink3:#6b7280;
    --track:#f3f4f6; --border:#e5e7eb; --hair:#e5e7eb;
    --played:#60a5fa; --gone:#fda4af; --pace:#64748b;
    --bad:#e11d48; --badbg:#ffe4e6; --ok:#059669; --okbg:#ecfdf5;
    --chip:#f3f4f6; --chip-ink:#4b5563;
  }
  body.dark{
    --card:#1f2937; --page:#111827; --ink:#f9fafb; --ink2:#d1d5db; --ink3:#9ca3af;
    --track:#374151; --border:#4b5563; --hair:#374151;
    --played:#3b82f6; --gone:#9f1239; --pace:#cbd5e1;
    --bad:#fb7185; --badbg:#4c0519; --ok:#34d399; --okbg:#022c22;
    --chip:#374151; --chip-ink:#d1d5db;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--hair);
    padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
  header.top h1{margin:0;font-size:16px}
  button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--ink);cursor:pointer}
  main{padding:16px;max-width:1180px;margin:0 auto}
  section{margin:0 0 44px}
  h2{font-size:17px;margin:0 0 6px}
  .why{color:var(--ink3);font-size:13px;margin:0 0 14px;max-width:66ch}
  .why b{color:var(--ink2)}
  .frames{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .frame > .cap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink3);margin-bottom:6px}
  .phone{width:390px;flex:0 0 390px}
  .desk{flex:1 1 560px;min-width:380px}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:16px}

  /* headline */
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .head h3{margin:0;font-size:15px;font-weight:800;letter-spacing:.01em}
  .head .meta{font-size:11px;color:var(--ink3)}
  .verdict{margin:10px 0 0;font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
  .verdict.bad{color:var(--bad)}
  .verdict.good{color:var(--ok)}
  .detail{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}
  .detail b{color:var(--ink)}

  .chart{margin-top:16px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr) var(--gut);gap:var(--gap);align-items:end}
  .cell{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .trackrow{position:relative}
  .num{font-size:12px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    color:var(--ink2);margin-bottom:4px}
  .num.hot{color:var(--bad)}
  .track{position:relative;border-radius:6px;background:var(--track);overflow:hidden}
  .fill{position:absolute;left:0;right:0;bottom:0;background:var(--played)}
  .goneband{position:absolute;left:0;right:0;top:0;background:var(--gone)}
  .track.hot{outline:2px solid var(--gone);outline-offset:1px}
  .paceline{position:absolute;left:0;right:calc(var(--gut) + var(--gap));
    border-top:2px dashed var(--pace);pointer-events:none;z-index:3}
  .pacetag{position:absolute;left:100%;top:0;transform:translateY(-50%);padding-left:5px;
    font-size:8.5px;font-weight:700;color:var(--ink3);line-height:1.05;text-align:left}
  .pacetag b{display:block;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .slot{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ink2);margin-top:7px}
  .slot.hot{color:var(--bad)}
  .lost{font-size:9.5px;font-weight:800;color:var(--bad);margin-top:1px;white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:10.5px;color:var(--ink3)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
  .sw.line{width:16px;height:0;border-top:2px dashed var(--pace);border-radius:0}

  .count{font-size:11px;color:var(--ink3);margin-top:9px}
  table.spec{border-collapse:collapse;font-size:12.5px;margin-top:10px;width:100%;max-width:820px}
  table.spec td,table.spec th{border-bottom:1px solid var(--hair);padding:6px 8px;text-align:left;vertical-align:top}
  table.spec th{color:var(--ink3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  table.spec b{color:var(--ink)}
  .gone-note{font-size:12px;color:var(--ink3);padding-left:12px;border-left:2px solid var(--hair)}
  .gone-note b{color:var(--ink2)}
</style>
</head>
<body>
<header class="top">
  <h1>Slot usage — simplified</h1>
  <button id="tog">Toggle dark</button>
</header>
<main id="app"></main>

<script>
const PACE = 60, DAYS = 20;
const ROWS = [
  { slot:'PG',  played:60,  est:82,  max:82,  cap:82,  mult:1 },
  { slot:'SG',  played:60,  est:82,  max:82,  cap:82,  mult:1 },
  { slot:'SF',  played:57,  est:78,  max:82,  cap:82,  mult:1 },
  { slot:'PF',  played:48,  est:66,  max:68,  cap:82,  mult:1 },
  { slot:'C',   played:60,  est:82,  max:82,  cap:82,  mult:1 },
  { slot:'G',   played:44,  est:60,  max:64,  cap:82,  mult:1 },
  { slot:'F',   played:59,  est:81,  max:82,  cap:82,  mult:1 },
  { slot:'UTIL',played:175, est:240, max:246, cap:248, mult:3 },
];
const pct  = (v,cap) => (v/cap)*100;
const gone = r => Math.max(0, r.cap - r.max);
const vs   = r => +(r.played - PACE * r.mult).toFixed(1);
const capT = r => r.cap === 248 ? '246+2' : r.cap;

function headline(){
  const lost = ROWS.filter(r => gone(r) > 0);
  const total = lost.reduce((s,r) => s + gone(r), 0);
  if (!lost.length) return `<p class="verdict good">Every slot can still reach a full season.</p>
    <p class="detail">Nothing is out of reach yet — keep filling every slot on game days.</p>`;
  return `<p class="verdict bad">${total} games already lost, across ${lost.length} slots.</p>
    <p class="detail">${lost.map(r => `<b>${r.slot} ${gone(r)}</b>`).join(' · ')} — these can never be played, whatever you do now.</p>`;
}

function chart(narrow, opts){
  const H = narrow ? 132 : 156;
  const W = narrow ? 32 : 52;
  const GUT = narrow ? 42 : 58;
  const paceP = pct(PACE, 82);

  const numRow = ROWS.map(r => {
    const hot = gone(r) > 0;
    const show = opts.numbers === 'all' || (opts.numbers === 'problems' && hot);
    return `<div class="cell"><div class="num ${hot ? 'hot' : ''}">${show ? r.played : '&nbsp;'}</div></div>`;
  }).join('') + '<div></div>';

  const trackRow = ROWS.map(r => {
    const g = pct(gone(r), r.cap), hot = gone(r) > 0;
    const tip = `${r.slot} — ${r.played} played of ${capT(r)} · projected ${r.est} · most still reachable ${r.max}` +
      (hot ? ` · ${gone(r)} gone for good` : '') + ` · ${Math.abs(vs(r)) < 1 ? 'on NBA pace' : (vs(r) < 0 ? Math.abs(vs(r)) + ' behind NBA pace' : vs(r) + ' ahead of NBA pace')}`;
    return `<div class="cell"><div class="track ${hot ? 'hot' : ''}" title="${tip}" style="height:${H}px;width:${W}px">
      ${g > 0 ? `<span class="goneband" style="height:${g}%"></span>` : ''}
      <span class="fill" style="height:${pct(r.played, r.cap)}%"></span>
    </div></div>`;
  }).join('') + '<div></div>';

  const labelRow = ROWS.map(r => {
    const hot = gone(r) > 0;
    return `<div class="cell"><div class="slot ${hot ? 'hot' : ''}">${r.slot}</div>
      ${hot ? `<div class="lost">${gone(r)} lost</div>` : '<div class="lost">&nbsp;</div>'}</div>`;
  }).join('') + '<div></div>';

  return `<div class="card">
    <div class="head">
      <h3>Slot usage</h3>
      <span class="meta">${DAYS} game days left · ${narrow ? '82/slot' : '82 games per slot, 246+2 for UTIL'}</span>
    </div>
    ${headline()}
    <div class="chart" style="--gap:${narrow ? 5 : 6}px;--gut:${GUT}px">
      <div class="grid">${numRow}</div>
      <div class="grid trackrow">${trackRow}
        <div class="paceline" style="bottom:${H * paceP / 100}px">
          <span class="pacetag">NBA pace<b>60</b></span>
        </div>
      </div>
      <div class="grid">${labelRow}</div>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--played)"></i>played</span>
      <span><i class="sw" style="background:var(--gone)"></i>lost for good</span>
      <span><i class="sw line"></i>where the NBA is</span>
    </div>
  </div>`;
}

document.getElementById('app').innerHTML = `
<section>
  <h2>S1 · Headline first, chart second</h2>
  <p class="why">The card answers the question before you look at anything. <b>“18 games already lost, across 2 slots · PF 14 · G 4”</b> is the whole story in one line — the chart is only there for people who want to see where. Everything that was decoration is gone: no est number, no dotted projection tick, no cap rule, no per-column pace ticks, no delta pills, no footnotes. Five legend entries became three, in plain words.</p>
  <div class="frames">
    <div class="frame phone"><div class="cap">Mobile · 390px</div>${chart(true,  { numbers:'all' })}</div>
    <div class="frame desk"><div class="cap">Desktop</div>${chart(false, { numbers:'all' })}</div>
  </div>
</section>

<section>
  <h2>S2 · Same, but numbers only where there is a problem</h2>
  <p class="why">Identical, except the count above each column appears <b>only on slots that lost games</b>. Eight numbers of near-identical size are hard to scan and mostly say “fine”; removing them leaves the eye nothing to do but notice the two rose columns. Everything else comes from tapping a column.</p>
  <div class="frames">
    <div class="frame phone"><div class="cap">Mobile · 390px</div>${chart(true,  { numbers:'problems' })}</div>
    <div class="frame desk"><div class="cap">Desktop</div>${chart(false, { numbers:'problems' })}</div>
  </div>
</section>

<section>
  <h2>What was removed, and where it went</h2>
  <table class="spec">
    <tr><th style="width:30%">Was on the card</th><th>Now</th></tr>
    <tr><td><b>est 82</b> above every column</td><td>tap / hover the column</td></tr>
    <tr><td><b>dotted projection tick</b></td><td>tap / hover — it was a third line competing with the pace line</td></tr>
    <tr><td><b>cap rule + “top of column = cap”</b></td><td>implied: the track <em>is</em> the cap. Stated once in the header</td></tr>
    <tr><td><b>/82 on every column</b></td><td>header, once</td></tr>
    <tr><td><b>vs pace pills row</b></td><td>the dashed line already shows it; exact number on tap</td></tr>
    <tr><td><b>two footnote lines</b></td><td>deleted — the headline says it in words</td></tr>
    <tr><td><b>5-entry legend</b></td><td>3 entries, plain words: played / lost for good / where the NBA is</td></tr>
  </table>
  <p class="why" style="margin-top:14px">Reading order is now fixed and short: <b>headline → rose columns → done.</b> Three eye stops instead of scanning eight columns and two number rows.</p>
</section>

<section>
  <h2>One thing worth your call</h2>
  <p class="gone-note"><b>The headline leads with “lost”, which is the alarming framing.</b> When nothing is lost it flips to a calm green line — “Every slot can still reach a full season.” If you would rather the card never shout, the alternative headline is neutral and factual: “6 of 8 slots on track for a full season.” Tell me which tone you want and I will set it.</p>
</section>`;
document.getElementById('tog').onclick = () => document.body.classList.toggle('dark');
</script>
</body>
</html>
