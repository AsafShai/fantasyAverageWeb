<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Draft — demo v5</title>
<style>
:root{
  --bg:#0b1020;--panel:#121a2f;--panel2:#18223d;--line:#26314f;--text:#e7ecf7;--muted:#8d99b8;
  --accent:#3b82f6;--accent2:#60a5fa;--warn:#f59e0b;--bad:#ef4444;--good:#22c55e;
  --PG:#3b82f6;--SG:#8b5cf6;--SF:#10b981;--PF:#f59e0b;--C:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#070b16;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top .grp{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.top .grp span{color:var(--muted);font-size:11px;padding:0 6px;text-transform:uppercase;letter-spacing:.04em}
.top button{background:transparent;border:0;color:var(--muted);padding:5px 9px;border-radius:6px;font-weight:600;font-size:12px}
.top button.on{background:var(--accent);color:#fff}
.top input[type=range]{width:80px}
.wrap{padding:10px 12px;display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h3{margin:0;padding:8px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .sub{font-weight:500;text-transform:none;letter-spacing:0}
.wrap[data-layout=broadcast]{grid-template-columns:1fr;grid-template-areas:"hero" "ticker" "main" "side"}
.wrap[data-layout=board]{grid-template-columns:1fr;grid-template-areas:"ticker" "main" "hero" "side"}
@media(min-width:1024px){
  .wrap[data-layout=broadcast]{grid-template-columns:3fr 1fr;grid-template-areas:"hero hero" "ticker ticker" "main side"}
  .wrap[data-layout=board]{grid-template-columns:3fr 1fr;grid-template-areas:"ticker ticker" "main hero" "main side"}
}
#hero{grid-area:hero}#ticker{grid-area:ticker}#main{grid-area:main}#side{grid-area:side;display:grid;gap:10px;align-content:start}
.wrap[data-layout=board] #hero .hero{grid-template-columns:1fr}
.wrap[data-layout=board] #hero .ring{width:96px;height:96px}
.wrap[data-layout=board] #hero .big{font-size:22px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 16px;background:linear-gradient(120deg,#0f1a3a,#121a2f 60%)}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.hero .nextup{justify-content:center}}
.ring{position:relative;width:132px;height:132px;margin:auto}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:#243055}.ring .fg{stroke:var(--accent2);transition:stroke-dashoffset .9s linear,stroke .3s}
.ring .fg.warn{stroke:var(--warn)}.ring .fg.bad{stroke:var(--bad)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.ring .lbl small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.otc .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.otc .big{font-size:30px;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:10px}
@media(max-width:700px){.otc .big{justify-content:center}}
.otc .big img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:cover}
.otc .owner{color:var(--muted);font-size:13px;margin-top:2px}
.otc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.otc .meta b{color:var(--text)}
.nextup{display:flex;gap:6px;flex-wrap:wrap}
.nextup .chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:88px}
.nextup .chip small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}
.nextup .chip b{font-size:12px}
.lastpick{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:200px}
.lastpick .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lastpick .n{font-weight:700;font-size:15px}
.lastpick .t{color:var(--muted);font-size:12px}
.flash{animation:flash 1.2s ease-out}
.paused{background:#3b2a05;border-bottom:1px solid #92400e;color:#fde68a;padding:6px 12px;font-size:12px;font-weight:700;text-align:center}
.news{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.35;max-width:320px}.news b{color:var(--text);font-weight:600}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(96,165,250,.9)}100%{box-shadow:0 0 0 18px rgba(96,165,250,0)}}
.lobby{padding:24px 16px;text-align:center}
.lobby .cd{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.lobby .order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.lobby .order div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.lobby .order div b{display:block;font-size:16px}
.tk{display:flex;overflow-x:auto;scroll-behavior:smooth}
.tk .c{flex:0 0 118px;padding:6px 8px;border-right:1px solid var(--line);min-height:56px}
.tk .c small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}
.tk .c b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .c i{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .c.now{background:var(--accent);color:#fff}.tk .c.now small,.tk .c.now i{color:#dbeafe}
.tk .r{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);border-right:1px solid var(--line);background:#0e1529}
.tk .r i{font-style:normal;font-size:12px}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.pane{display:none;padding:10px}.pane.on{display:block}
.board{overflow:auto;max-height:72vh}
.board table{border-collapse:separate;border-spacing:3px;min-width:900px}
.board th{position:sticky;top:0;background:var(--panel);font-size:10px;color:var(--muted);padding:4px 2px;text-transform:uppercase;z-index:2}
.board th img{width:22px;height:22px;border-radius:50%;background:#fff;display:block;margin:0 auto 2px}
.board td{width:110px;height:44px;vertical-align:top;border-radius:6px;background:var(--panel2);padding:4px 6px;font-size:11px;position:relative}
.board td.rn{width:44px;min-width:44px;background:transparent;color:var(--muted);font-weight:800;text-align:center;vertical-align:middle;position:sticky;left:0;z-index:1;font-size:11px}
.board td.rn i{display:block;font-style:normal;font-size:12px;color:#556}
.board td b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board td small{color:var(--muted);font-size:10px}
.board td.now{outline:2px solid var(--accent2);animation:pulse 1.4s infinite}
.board td.new{animation:flash 1.2s ease-out}
.board td .tag{position:absolute;right:4px;top:4px;font-size:9px;font-weight:800;padding:1px 4px;border-radius:4px}
.board td.p-PG{background:#1e3a8a}.board td.p-SG{background:#4c1d95}.board td.p-SF{background:#064e3b}.board td.p-PF{background:#78350f}.board td.p-C{background:#7f1d1d}
.board td[class*=p-] small{color:#cbd5e1}
@keyframes pulse{0%,100%{outline-color:var(--accent2)}50%{outline-color:transparent}}
.tag.auto{background:#374151;color:#d1d5db}.inj{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:600;margin-left:4px;vertical-align:middle}.inj.Out,.inj.Doubtful{background:#7f1d1d;color:#fecaca}.inj.Questionable,.inj.Probable{background:#78350f;color:#fde68a}.inj.Suspended{background:#374151;color:#d1d5db}
.hs{width:34px;height:34px;border-radius:50%;background:#1b2440;object-fit:cover;flex:0 0 auto}.tsel button.ap{border-color:#6b7280}.tag.inj{background:#78350f;color:#fcd34d}.tag.up{background:#1e3a5f;color:#bfdbfe}.tag.dn{background:#3f2a2a;color:#fecaca}
.feed{display:grid;gap:6px;max-height:72vh;overflow:auto}
.feed .row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:6px 10px}
.feed .row .pk{font-weight:800;color:var(--muted);font-size:12px}.feed .row .pk b{display:block;color:var(--text);font-size:14px}
.feed .row .nm{font-weight:700}.feed .row .tm{color:var(--muted);font-size:12px}
.feed .row .rt{text-align:right;font-size:11px;color:var(--muted)}
.pos{display:inline-block;font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;color:#fff;margin-left:4px;vertical-align:middle}
.pos.PG{background:var(--PG)}.pos.SG{background:var(--SG)}.pos.SF{background:var(--SF)}.pos.PF{background:var(--PF)}.pos.C{background:var(--C)}
/* teams */
.tsel{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tsel button{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--muted);padding:4px 8px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.tsel button img{width:18px;height:18px;border-radius:50%;background:#fff}
.tsel button.on{border-color:var(--accent2);color:var(--text);background:#1b2c52}
.tsel button.clk{box-shadow:inset 0 -2px 0 var(--accent2)}
.tsel button .n{background:#243055;border-radius:99px;padding:0 5px;font-size:10px}
.team{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.team{grid-template-columns:1fr 1fr}}
.team .hd{display:flex;align-items:center;gap:10px;grid-column:1/-1}.team .hd img{width:34px;height:34px;border-radius:50%;background:#fff}
.team .hd b{font-size:16px;display:block}.team .hd small{color:var(--muted)}
.team .hd label{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.team .bars{display:flex;gap:4px}
.team .bars div{flex:1;height:8px;border-radius:4px;background:#243055;position:relative}
.team .bars div i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.team .bars div span{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;color:var(--muted);text-transform:uppercase;padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td{padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid #1b2440;white-space:nowrap}
.tbl td.l b{font-weight:600}
.tbl tr.empty td{color:#3d4a6b}
.tbl th.sort{color:var(--text);cursor:pointer}.tbl th[data-k]{cursor:pointer}
.tbl tr.hl td{background:#1b2c52}
.tbl .rk{color:var(--muted);width:30px}
.avail .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.avail input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;min-width:180px}
.avail .pf button,.seg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}
.avail .pf button.on,.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;gap:2px}
.scroll{overflow:auto;max-height:64vh}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;padding:10px}
.kv div{background:var(--panel2);border-radius:8px;padding:8px}
.kv small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:18px;font-variant-numeric:tabular-nums}
.list{padding:6px 10px;display:grid;gap:4px}
.list .li{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 6px;border-radius:6px;background:var(--panel2)}
.list .li .n{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .v{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.alert{margin:8px 10px;background:#3b2a05;border:1px solid #92400e;color:#fde68a;border-radius:8px;padding:8px 10px;font-size:12px}
.runbar{display:flex;gap:2px}.runbar i{flex:1;height:14px;border-radius:2px;opacity:.9}
.hbar{display:grid;gap:5px;padding:6px 10px}
.hbar .h{display:grid;grid-template-columns:60px 1fr 40px;gap:8px;align-items:center;font-size:11px}
.hbar .h i{height:8px;border-radius:4px;background:var(--accent);display:block}
.hbar .h span{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.toasts{position:fixed;right:12px;bottom:12px;display:grid;gap:6px;z-index:30;max-width:280px}
.toast{background:#0c2a5a;border:1px solid #1d4ed8;border-radius:10px;padding:8px 10px;font-size:12px;animation:in .25s ease-out}
.toast b{display:block;font-size:13px}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.note{color:var(--muted);font-size:11px;padding:6px 10px}
.done{padding:18px;text-align:center}.done .big{font-size:26px;font-weight:800}
.cat{font-size:10px}
[data-pid]{cursor:pointer}[data-pid]:hover{text-decoration:underline}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}.sheet-bg.on{display:block}
.sheet{position:fixed;z-index:41;right:0;top:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .2s}.sheet.on{transform:none}
.sheet .hd{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.sheet .hd img{width:64px;height:64px;border-radius:50%;background:#1b2440;object-fit:cover}
.sheet .hd b{font-size:18px;display:block}.sheet .hd small{color:var(--muted)}
.sheet .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:32px;height:32px}
.sheet .sec{padding:12px 14px;border-bottom:1px solid var(--line)}.sheet .sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sheet .kv{padding:0}.sheet .draft{background:#1b2c52;border-radius:8px;padding:8px 10px;font-size:13px}
@media(max-width:700px){.sheet{top:auto;height:85vh;width:100vw;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(100%)}}
</style>
</head>
<body>
<div class="top">
  <div class="grp"><span>Phase</span><button data-phase="lobby">Lobby</button><button data-phase="live" class="on">Live</button><button data-phase="done">Done</button></div>
  <div class="grp"><span>Layout</span><button data-layout="broadcast" class="on">A · Broadcast</button><button data-layout="board">B · Board-first</button></div>
  <div class="grp"><span>Sim</span><button id="play">⏸ Pause</button><button id="step">Step ▶</button><button id="reset">↺</button><button id="lmpause">LM pause</button><span>speed</span><input id="speed" type="range" min="1" max="30" value="10"><span id="speedv">10×</span></div>
  <div class="grp"><span>Poll</span><input id="poll" type="range" min="1" max="15" value="2"><span id="pollv">2s</span></div>
  <div class="grp"><span>Clock</span><button data-clock="derived" class="on">Derived</button><button data-clock="pace">Pace only</button></div>
</div>

<div class="wrap" data-layout="broadcast">
  <div id="hero" class="card"></div>
  <div id="ticker" class="card"><div class="tk" id="tk"></div></div>
  <div id="main" class="card">
    <div class="tabs">
      <button data-tab="board" class="on">Draft board</button>
      <button data-tab="avail">Available players</button>
      <button data-tab="teams">Teams</button>
      <button data-tab="proj">Projected standings</button>
      <button data-tab="feed">Pick feed</button>
      <button data-tab="trends">Trends</button>
    </div>
    <div class="pane on" data-pane="board"><div class="board" id="board"></div><div class="note">3RR snake: R1 →, R2 ←, R3 ←, R4 →… Columns = round-1 draft slot, from ESPN's pre-created <code>picks[].teamId</code>. Cell colour = first eligible position. Roster slot per pick is ESPN's own <code>lineupSlotId</code>.</div></div>
    <div class="pane avail" data-pane="avail" id="avail"></div>
    <div class="pane" data-pane="teams" id="teams"></div>
    <div class="pane" data-pane="proj" id="proj"></div>
    <div class="pane" data-pane="feed"><div class="feed" id="feed"></div></div>
    <div class="pane" data-pane="trends" id="trends"></div>
  </div>
  <div id="side"></div>
</div>
<div class="toasts" id="toasts"></div>

const NEWS = {3112335:'Jokic (illness) registered eight points, eight rebounds in 23 minutes during Serbia win over Italy in a FIBA qualifier. (Rotowire · Sep 1)'};
const newsHtml = pid => NEWS[pid] ? `<div class="news"><b>Latest news:</b> ${NEWS[pid]}</div>` : `<div class="news"><b>Latest news:</b> <span style="opacity:.6">(Rotowire blurb via ESPN news feed — demo has sample for Jokic only)</span></div>`;
const HS = pid => `https://a.espncdn.com/i/headshots/nba/players/full/${pid}.png`;
const SLOTS = ['PG','SG','SF','PF','C','G','F','UTIL','UTIL','UTIL','BE','BE','BE','BE'];
const f1 = v => v==null?'—':(+v).toFixed(1);
const fp = v => v==null?'—':(+v*100).toFixed(1);
const pickDur = i => { const p=PICKS[i]; if(!p) return 30; if(p.auto) return TPS; const h=(p.pid*2654435761)>>>0; const base=8+(h%50); return p.round<=2?base+15:base; };


let S = { phase:'live', layout:'broadcast', clock:'derived', tab:'board', playing:true, speed:10, poll:2, lmPaused:false,
  espnPicks:0, seenPicks:0, tPick:0, lastSeenAt:0, nextPollAt:0, now:0, durations:[],
  teamSel:null, followClock:true, statsFrom:'ly', rosterView:'slots', standView:'rank', posF:'ALL', q:'', sortK:'adp', sortAsc:true, availLimit:40 };
function reset(){ S.espnPicks=0;S.seenPicks=0;S.tPick=0;S.lastSeenAt=0;S.nextPollAt=0;S.now=0;S.durations=[]; renderAll(); }

function tick(dt){
  if (S.phase!=='live') return;
  S.now += dt;
  if (S.espnPicks < TOTAL && !S.lmPaused){ S.tPick += dt; if (S.tPick >= pickDur(S.espnPicks)){ S.espnPicks++; S.tPick=0; } }
  if (S.now >= S.nextPollAt){
    S.nextPollAt = S.now + S.poll;
    if (S.espnPicks !== S.seenPicks){
      for (let i=S.seenPicks;i<S.espnPicks;i++){ S.durations.push(S.now - S.lastSeenAt); toast(PICKS[i]); S.lastSeenAt=S.now; }
      const before=S.seenPicks; S.seenPicks = S.espnPicks; for (let r=Math.floor(before/N)+1; r<=Math.floor(S.seenPicks/N); r++) roundToast(r); renderPicks();
    }
  }
  renderClock();
  if (S.seenPicks>=TOTAL){ S.phase='done'; syncTop(); renderAll(); }
}
let last = performance.now();
function loop(t){ const real=(t-last)/1000; last=t; if (S.playing) tick(real*S.speed); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

const seen = () => PICKS.slice(0,S.seenPicks);
const curPick = () => S.seenPicks+1;
const avgDur = () => S.durations.length ? S.durations.reduce((a,b)=>a+b,0)/S.durations.length : 45;
const remainingSec = () => (TOTAL - S.seenPicks) * avgDur();
const roster = id => seen().filter(p=>p.team===id);
const posCounts = id => { const c={PG:0,SG:0,SF:0,PF:0,C:0}; roster(id).forEach(p=>P(p.pid).pos.forEach(x=>c[x]++)); return c; };
const onAutopilot = id => { const r=roster(id); return r.length>=2 && r.slice(-2).every(p=>p.auto); };
const rosterBySlot = id => { const slots=SLOTS.map(s=>({slot:s,p:null})); for (const p of roster(id)){ const want=p.slot||'BE'; let s=slots.find(x=>!x.p&&x.slot===want); if(!s) s=slots.find(x=>!x.p&&(x.slot==='BE'||x.slot==='UTIL')); if(s) s.p=p; } return slots; };
const diff = p => P(p.pid).adp ? Math.round(P(p.pid).adp - p.pick) : null;
const tagHtml = p => { const q=P(p.pid); if (p.auto) return '<span class="tag auto" style="position:static">AUTO</span>'; const d=diff(p); if (d==null||Math.abs(d)<10) return ''; return `<span class="tag ${d>0?'up':'dn'}" style="position:static">${d>0?'+':''}${d} vs ADP</span>`; };
const posRun = () => { const s=seen(); let n=0,pos=null; for (let i=s.length-1;i>=0;i--){ const q=P(s[i].pid).pos[0]; if(pos===null)pos=q; if(q!==pos)break; n++; } return {pos,n}; };
const slowest = () => { const m={}; S.durations.forEach((d,i)=>{ const t=PICKS[i].team; (m[t]=m[t]||[]).push(d); }); return Object.entries(m).map(([t,a])=>({t:+t,avg:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>b.avg-a.avg); };
const onClockTeam = () => S.phase==='live' && S.seenPicks<TOTAL ? teamForPick(curPick()) : null;

function renderAll(){ renderHero(); renderTicker(); renderBoard(); renderAvail(); renderTeams(); renderProj(); renderFeed(); renderTrends(); renderSide(); renderClock(); }
function renderPicks(){ renderAll(); }

function renderClock(){
  if (S.phase!=='live') return;
  const el=document.getElementById('clockv'), fg=document.getElementById('ringfg'), k=document.getElementById('clockk'); if(!el) return;
  const since = S.lmPaused ? S.tPick : S.now - S.lastSeenAt;
  document.getElementById('pollago').textContent = Math.max(0,Math.round(S.poll-(S.nextPollAt-S.now)))+'s';
  if (S.clock==='pace'){ el.textContent=fmt(since); k.textContent='since last pick'; fg.style.strokeDashoffset=276.5*(1-Math.min(1,since/avgDur())); fg.className.baseVal='fg'; return; }
  const rem = Math.max(0, TPS - since);
  el.textContent = (rem===0?'':'~')+fmt(rem); k.textContent = rem===0 ? (since>TPS+20 ? 'stalled · paused?' : 'overtime') : 'on the clock';
  fg.style.strokeDashoffset = 276.5*(1-rem/TPS);
  fg.className.baseVal = 'fg'+(rem<=15?' bad':rem<=30?' warn':'');
}

const dirArrow = r => (r%4===0||r%4===3) ? '→' : '←';   // 3RR: rounds 1,4,5,8,9… forward
function renderTicker(){
  const tk=document.getElementById('tk'); const pk=curPick(); let html='';
  for (let p=1;p<=TOTAL;p++){
    const t=T(teamForPick(p)), done=p<=S.seenPicks;
    if ((p-1)%N===0){ const r=Math.floor((p-1)/N); html+=`<div class="r">R${r+1}<i>${dirArrow(r)}</i></div>`; }
    html+=`<div class="c ${p===pk&&S.phase==='live'?'now':''}" id="tkc${p}"><small>Pick ${p}</small><b>${esc(t.abbrev)}</b><i>${done?esc(P(PICKS[p-1].pid).name):p===pk?'On the clock':''}</i></div>`;
  }
  tk.innerHTML=html; const c=document.getElementById('tkc'+pk); if(c) tk.scrollLeft=Math.max(0,c.offsetLeft-tk.clientWidth/2+60);
}

function renderBoard(){
  const b=document.getElementById('board'); const pk=curPick();
  const col={}; SLOT_ORDER.forEach((id,i)=>col[id]=i);
  let html='<table><tr><th></th>'+SLOT_ORDER.map((id,i)=>`<th><img src="${T(id).logo}" alt="">${i+1} · ${esc(T(id).abbrev)}</th>`).join('')+'</tr>';
  for (let r=0;r<ROUNDS;r++){
    const cells=new Array(N);
    for (let i=0;i<N;i++){ const p=r*N+i+1; cells[col[teamForPick(p)]]=p; }
    html+=`<tr><td class="rn">${r+1}<i>${dirArrow(r)}</i></td>`;
    for (const p of cells){
      const made=p<=S.seenPicks?PICKS[p-1]:null;
      if (made){ const q=P(made.pid); html+=`<td class="p-${q.pos[0]} ${p===S.seenPicks?'new':''}" data-pid="${made.pid}"><b>${esc(q.name)}</b><small>#${p} · R${r+1}.${(p-1)%N+1} · ${q.pos.join('/')}</small>${made.auto?'<span class="tag auto">AUTO</span>':''}</td>`; }
      else html+=`<td class="${p===pk&&S.phase==='live'?'now':''}"><small>#${p}</small></td>`;
    }
    html+='</tr>';
  }
  b.innerHTML=html+'</table>';
}

    .map(([id,p])=>({id:+id,p,st:p[src],d:byPid[+id]||null}));

      <td>${r.st?.gp??'—'}</td><td>${fp(r.st?.fgp)}</td><td>${fp(r.st?.ftp)}</td><td>${f1(r.st?.tpm)}</td><td>${f1(r.st?.pts)}</td><td>${f1(r.st?.reb)}</td><td>${f1(r.st?.ast)}</td><td>${f1(r.st?.stl)}</td><td>${f1(r.st?.blk)}</td></tr>`).join('')}</table>
    ${rows.length>S.availLimit?`<div class="note"><button id="more" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 10px">Show more</button></div>`:''}</div>
    <div class="note">Sources: ESPN ADP + ESPN ROTO rank, Last year = 2025-26 per-game, Projected = ESPN 2026-27. Injury badge: ESPN injuries feed (site.web.api.espn.com … /nba/injuries: Out / Day-To-Day + Rotowire comment) as pre-season source, our injury DB once the official report starts; demo maps ESPN status. Search also finds drafted players.</div>`;

// ---- Projected standings (roto, from drafted players' projections) ----
function teamTotals(id){ const r=roster(id).map(p=>P(p.pid).proj).filter(Boolean); if(!r.length) return null; const gp=r.reduce((a,s)=>a+(s.gp||0),0); const o={gp}; for(const [k] of CATS){ if(k==='fgp'||k==='ftp'){ o[k]=r.reduce((a,s)=>a+s[k]*(s.gp||0),0)/(gp||1); } else o[k]=r.reduce((a,s)=>a+s[k]*(s.gp||0),0); } o.n=r.length; return o; }
function renderProj(){
  const el=document.getElementById('proj'); const rows=SLOT_ORDER.map(id=>({id,t:teamTotals(id)}));
  const pts={}; rows.forEach(r=>pts[r.id]={total:0});
  for (const [k] of CATS){ const have=rows.filter(r=>r.t); have.sort((a,b)=>b.t[k]-a.t[k]); have.forEach((r,i)=>{ const p=N-i; pts[r.id][k]=p; pts[r.id].total+=p; }); }
  const ord=rows.slice().sort((a,b)=>pts[b.id].total-pts[a.id].total);
  const clk=onClockTeam();
  const rk=S.standView==='rank';
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 8px"><span class="note" style="padding:0">Projected season totals of players drafted so far, roto-scored (12 = best). Same math as Rankings page. Informational.</span>
    <div class="seg"><button data-sv="rank" class="${rk?'on':''}">Rank points</button><button data-sv="value" class="${!rk?'on':''}">Values</button></div></div>
    <div style="overflow:auto"><table class="tbl"><tr><th class="rk">#</th><th class="l">Team</th><th>Picks</th><th>GP</th>${CATS.map(([k,l])=>`<th>${l}</th>`).join('')}<th>Total</th></tr>
    ${ord.map((r,i)=>`<tr class="${r.id===clk?'hl':''}"><td class="rk">${r.t?i+1:'—'}</td><td class="l"><b>${esc(T(r.id).name)}</b></td><td>${r.t?r.t.n:0}</td><td>${r.t?Math.round(r.t.gp):'—'}</td>${CATS.map(([k])=>`<td>${r.t?(rk?pts[r.id][k]:(k==='fgp'||k==='ftp'?fp(r.t[k]):Math.round(r.t[k]))):'—'}</td>`).join('')}<td><b>${r.t?pts[r.id].total:'—'}</b></td></tr>`).join('')}</table></div>`;
  el.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{ S.standView=b.dataset.sv; renderProj(); });
}

function renderFeed(){
  const f=document.getElementById('feed'); const s=seen().slice().reverse();
  f.innerHTML = s.length? s.map(p=>{ const q=P(p.pid); return `<div class="row" style="grid-template-columns:44px 34px 1fr auto"><div class="pk">R${p.round}<b>#${p.pick}</b></div><img class="hs" src="${HS(p.pid)}" alt="">
    <div><div class="nm" data-pid="${p.pid}">${esc(q.name)} ${q.pos.map(x=>`<span class="pos ${x}">${x}</span>`).join('')}${injHtml(q.inj)}</div><div class="tm">${esc(T(p.team).name)}${S.durations[p.pick-1]!=null?` · took ${Math.round(S.durations[p.pick-1])}s`:''}</div></div>
    <div class="rt">ADP ${q.adp?Math.round(q.adp):'—'} · ESPN rk ${q.espnRank??'—'}<br>${tagHtml(p)}</div></div>`; }).join('') : '<div class="note">No picks yet.</div>';
}

function renderTrends(){
  const el=document.getElementById('trends'); const s=seen();
  const byRound={}; s.forEach(p=>{ (byRound[p.round]=byRound[p.round]||{PG:0,SG:0,SF:0,PF:0,C:0})[P(p.pid).pos[0]]++; });
  const run=posRun();
  const withD=s.filter(p=>diff(p)!=null); const fell=withD.filter(p=>diff(p)>0).sort((a,b)=>diff(b)-diff(a)).slice(0,8); const early=withD.filter(p=>diff(p)<0).sort((a,b)=>diff(a)-diff(b)).slice(0,8);
  const rt={}; S.durations.forEach((d,i)=>{ const r=PICKS[i].round; rt[r]=(rt[r]||0)+d; }); const rtArr=Object.entries(rt).filter(([r])=>+r*N<=S.seenPicks);
  const li=p=>`<div class="li"><span class="tag ${diff(p)>0?'up':'dn'}" style="position:static">${diff(p)>0?'+':''}${diff(p)}</span><span class="n" data-pid="${p.pid}">${esc(P(p.pid).name)}</span><span class="v">#${p.pick} · ${esc(T(p.team).abbrev)}</span></div>`;
  el.innerHTML=`
    ${run.n>=3?`<div class="alert" style="margin:0 0 10px">🔥 ${run.n} straight ${run.pos}s taken</div>`:''}
    <div class="card" style="margin-bottom:10px"><h3>Positions taken by round <span class="sub">first eligible pos</span></h3>
      <div style="padding:10px;display:grid;gap:4px">${Object.entries(byRound).map(([r,c])=>`<div style="display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;font-size:11px"><span style="color:var(--muted)">R${r}</span><div class="runbar">${POSN.map(p=>`<i style="flex:${c[p]||0.0001};background:var(--${p})" title="${p}: ${c[p]}"></i>`).join('')}</div></div>`).join('')||'<div class="note">Waiting for picks…</div>'}</div>
      <div class="note">${POSN.map(p=>`<span class="pos ${p}">${p}</span>`).join(' ')}</div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px">
    <div class="card"><h3>Fell furthest <span class="sub">picked later than ADP</span></h3><div class="list">${fell.map(li).join('')||'<div class="note">Waiting…</div>'}</div></div>
    <div class="card"><h3>Taken earliest <span class="sub">picked before ADP</span></h3><div class="list">${early.map(li).join('')||'<div class="note">Waiting…</div>'}</div></div>
    <div class="card"><h3>Round times <span class="sub">completed rounds</span></h3><div class="hbar">${rtArr.map(([r,sec])=>`<div class="h"><span style="text-align:left;color:var(--text)">R${r}</span><i style="width:${Math.min(100,sec/(N*TPS)*100)}%"></i><span>${fmt(sec)}</span></div>`).join('')||'<div class="note">Waiting…</div>'}</div></div>
    </div>`;
}

function renderSide(){
  const el=document.getElementById('side'); const run=posRun(); const s=seen().slice(-6).reverse();
  el.innerHTML=`
    <div class="card"><h3>Draft status</h3><div class="kv">
      <div><small>Progress</small><b>${S.seenPicks}/${TOTAL}</b></div><div><small>Round</small><b>${Math.min(ROUNDS,Math.floor(S.seenPicks/N)+1)}/${ROUNDS}</b></div>
      <div><small>Avg pick</small><b>${Math.round(avgDur())}s</b></div><div><small>ETA</small><b>${fmt(remainingSec())}</b></div>
      <div><small>Autopicks</small><b>${seen().filter(p=>p.auto).length}</b></div><div><small>Elapsed</small><b>${fmt(S.now)}</b></div></div></div>
    ${run.n>=3?`<div class="alert">🔥 ${run.n} straight ${run.pos}s</div>`:''}
    <div class="card"><h3>Recent picks</h3><div class="list">${s.map(p=>`<div class="li"><span class="v">#${p.pick}</span><span class="n" data-pid="${p.pid}">${esc(P(p.pid).name)}</span><span class="v">${esc(T(p.team).abbrev)}</span></div>`).join('')||'<div class="note">—</div>'}</div></div>
    <div class="card"><h3>Round ${Math.min(ROUNDS,Math.floor(S.seenPicks/N)+1)} order</h3><div class="list">${(()=>{ const r=Math.min(ROUNDS-1,Math.floor(S.seenPicks/N)); return Array.from({length:N},(_,i)=>r*N+i+1).map(p=>`<div class="li" style="${p===curPick()?'outline:1px solid var(--accent2)':''}"><span class="v">#${p}</span><span class="n">${esc(T(teamForPick(p)).name)}</span><span class="v">${p<=S.seenPicks?esc(P(PICKS[p-1].pid).name):''}</span></div>`).join(''); })()}</div></div>`;
}

function roundToast(r){ const s=PICKS.slice((r-1)*N,r*N); const c={PG:0,SG:0,SF:0,PF:0,C:0}; s.forEach(p=>c[P(p.pid).pos[0]]++); const sec=S.durations.slice((r-1)*N,r*N).reduce((a,b)=>a+b,0); const t=document.getElementById('toasts'); const d=document.createElement('div'); d.className='toast'; d.style.background='#1f2937'; d.style.borderColor='#4b5563'; d.innerHTML=`<b>Round ${r} complete · ${fmt(sec)}</b>${POSN.map(p=>`${p} ${c[p]}`).join(' · ')}`; t.appendChild(d); setTimeout(()=>d.remove(),6000); }
function toast(p){ const t=document.getElementById('toasts'); const d=document.createElement('div'); d.className='toast'; d.innerHTML=`<b>#${p.pick} ${esc(P(p.pid).name)}</b>${esc(T(p.team).name)} ${tagHtml(p)}`; t.appendChild(d); setTimeout(()=>d.remove(),3500); while(t.children.length>4) t.firstChild.remove(); }

function openSheet(pid){
  const q=P(pid); const d=seen().find(p=>p.pid===+pid); const st=k=>q[k];
  const row=(lbl,s)=>`<tr><td class="l" style="color:var(--muted)">${lbl}</td><td>${s?.gp??'—'}</td><td>${fp(s?.fgp)}</td><td>${fp(s?.ftp)}</td><td>${f1(s?.tpm)}</td><td>${f1(s?.pts)}</td><td>${f1(s?.reb)}</td><td>${f1(s?.ast)}</td><td>${f1(s?.stl)}</td><td>${f1(s?.blk)}</td></tr>`;
  document.getElementById('sheet').innerHTML=`<div class="hd"><img src="${HS(pid)}" alt=""><div><b>${esc(q.name)}</b><small>${NBA[q.pro]||'—'} · ${q.pos.join('/')} ${injHtml(q.inj)}</small></div><button class="x" id="sheetx">✕</button></div>
    <div class="sec">${d?`<div class="draft">Drafted <b>R${d.round} #${d.pick}</b> by <b>${esc(T(d.team).name)}</b>${d.auto?' · <span class="tag auto" style="position:static">AUTO</span>':''}${d.slot?` · slot ${d.slot}`:''}</div>`:`<div class="draft" style="background:var(--panel2)">Available</div>`}</div>
    <div class="sec"><div class="kv" style="grid-template-columns:repeat(3,1fr)"><div><small>ESPN ADP</small><b>${q.adp?q.adp.toFixed(1):'—'}</b></div><div><small>ESPN rank</small><b>${q.espnRank??'—'}</b></div><div><small>vs ADP</small><b>${d&&diff(d)!=null?(diff(d)>0?'+':'')+diff(d):'—'}</b></div></div></div>
    <div class="sec"><h4>Stats</h4><div style="overflow:auto"><table class="tbl"><tr><th class="l"></th><th>GP</th><th>FG%</th><th>FT%</th><th>3PM</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr>${row('2025-26',st('ly'))}${row('Proj 26-27',st('proj'))}</table></div></div>
    <div class="sec"><h4>Latest news</h4>${newsHtml(+pid).replace('class="news"','class="news" style="max-width:none"')}</div>
    <div class="sec note" style="padding:12px 14px">Real impl: same PlayerDetailSheet as ADP / mock draft pages (last 3 seasons, injury DB, player page link).</div>`;
  document.getElementById('sheet').classList.add('on'); document.getElementById('sheetbg').classList.add('on');
  document.getElementById('sheetx').onclick=closeSheet;
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('sheetbg').classList.remove('on'); }
document.getElementById('sheetbg').onclick=closeSheet;
document.addEventListener('click',e=>{ const el=e.target.closest('[data-pid]'); if(el) openSheet(el.dataset.pid); });
function syncTop(){ document.querySelectorAll('[data-phase]').forEach(b=>b.classList.toggle('on',b.dataset.phase===S.phase)); document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('on',b.dataset.layout===S.layout)); document.querySelectorAll('[data-clock]').forEach(b=>b.classList.toggle('on',b.dataset.clock===S.clock)); document.querySelector('.wrap').dataset.layout=S.layout; document.getElementById('play').textContent=S.playing?'⏸ Pause':'▶ Play'; }
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{ S.phase=b.dataset.phase; if(S.phase==='live'&&S.seenPicks>=TOTAL){reset();} if(S.phase==='done'){S.espnPicks=S.seenPicks=TOTAL;} if(S.phase==='lobby'){reset();} syncTop(); renderAll(); });
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{ S.layout=b.dataset.layout; syncTop(); });
document.querySelectorAll('[data-clock]').forEach(b=>b.onclick=()=>{ S.clock=b.dataset.clock; syncTop(); renderClock(); });
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('on',x.dataset.pane===S.tab)); });
document.getElementById('play').onclick=()=>{ S.playing=!S.playing; syncTop(); };
document.getElementById('step').onclick=()=>{ if(S.phase!=='live')return; S.espnPicks=Math.min(TOTAL,S.espnPicks+1); S.tPick=0; S.nextPollAt=S.now; tick(0.001); };
document.getElementById('lmpause').onclick=()=>{ S.lmPaused=!S.lmPaused; document.getElementById('lmpause').classList.toggle('on',S.lmPaused); if(!S.lmPaused){ S.lastSeenAt=S.now-S.tPick; } renderHero(); };
document.getElementById('reset').onclick=()=>{ S.phase='live'; reset(); syncTop(); };
document.getElementById('speed').oninput=e=>{ S.speed=+e.target.value; document.getElementById('speedv').textContent=S.speed+'×'; };
document.getElementById('poll').oninput=e=>{ S.poll=+e.target.value; document.getElementById('pollv').textContent=S.poll+'s'; };
S.espnPicks=S.seenPicks=27; S.durations=PICKS.slice(0,27).map((_,i)=>pickDur(i)); S.now=S.durations.reduce((a,b)=>a+b,0); S.lastSeenAt=S.now; S.nextPollAt=S.now;
syncTop(); renderAll();
</script>
</body>
</html>
